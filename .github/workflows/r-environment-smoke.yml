name: FRA RSS — R environment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::magrittr
            any::openxlsx
            any::readxl
            any::rmarkdown
            any::knitr
          cache-version: 1
      - name: Confirm packages, R version and sample arithmetic
        run: Rscript scripts/ci/r-smoke-test.R
