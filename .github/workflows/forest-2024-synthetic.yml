name: Forest 2024 synthetic validation
on:
  workflow_dispatch:
  push:
    branches: [main, feature/forest-2024-synthetic]
    paths:
      - 'R/forest_2024_synthetic.R'
      - 'R/forest_2024_reconstructed.R'
      - 'R/forest_2024_audit.R'
      - 'R/forest_2024_readonly_adapter.R'
      - 'tests/test_forest_2024_synthetic.R'
      - 'tests/test_forest_2024_reconstructed.R'
      - 'tests/test_forest_2024_audit.R'
      - 'tests/test_forest_2024_readonly_adapter.R'
      - '.github/workflows/forest-2024-synthetic.yml'
  pull_request:
    paths:
      - 'R/forest_2024_synthetic.R'
      - 'tests/test_forest_2024_synthetic.R'
      - '.github/workflows/forest-2024-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Run Forest 2024 synthetic tests
        run: |
          Rscript tests/test_forest_2024_synthetic.R
          Rscript tests/test_forest_2024_reconstructed.R
          Rscript tests/test_forest_2024_audit.R
          Rscript tests/test_forest_2024_readonly_adapter.R
