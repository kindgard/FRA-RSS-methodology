name: FRA RSS — safe runner preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::magrittr
            any::openxlsx
            any::readxl
            any::rmarkdown
            any::knitr
            any::stringr
          cache-version: 1
      - name: Validate runner structure without FAO data
        run: |
          Rscript -e 'parse(file="scripts/ci/run-rss.R"); cat("PASS: RSS runner parses. No raw data processed.\\n")'
          test ! -d Inputs
          test ! -d Outputs
